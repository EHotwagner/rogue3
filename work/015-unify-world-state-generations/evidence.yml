    notes: ["PD-015. Two independent fresh-context critics reviewed the candidate and both changed what ships. The code critic ran 38 mutations one at a time against a full suite and found 19 passing GREEN, including all three mutations of `actorRadius` -- the derivation this change is built on, which could be pinned to a constant 64.0, the exact unspawnable shape the removal exists to make unrepresentable -- and the removal of either `HitPoints > 0.0` filter from the `EnemyDied` death count, which silences death audio entirely with the suite green. Four guard tests were added in response: the roster radius and contact-damage derivation with a behavioural Brute-versus-Fly overlap at 25 units; the death-cue emission (one on a kill, zero on a survivor); the shot pass-through filter, whose existing assertion counted shots spawned in a tick during which none reached the obstacle and so could not fail; and a bomb KILL, which no test covered. Re-verified by re-running the mutations: `actorRadius = 64.0`, `aliveAfter` without its filter and `shotPassThrough` at 32x32 each now fail. The fourth green mutation, bombs damaging a zero-hit-point corpse, is accepted as a provable no-op because `max 0.0` leaves a corpse at zero either way. A fifth test was added to `M4ProceduralFloorTests` after the evidence critic found only `M10` asserted its descent fixtures were non-empty before the descent."]
