    notes: ["FR-008/AC-008. Gameplay behaviour is preserved at unchanged numeric values across the suite -- 6.5 hit points after one shot, 20.0 after a two-bomb chain, 40.0 after a black-heart burst, 30.0 unchanged under friendly fire, one half-heart per contact with its 0.5 s re-tick, X = 87 at a blocking obstacle, one red half-heart on spikes, one typed kill per death, one drop roll per death -- with ONE declared exception an independent critic established by building both revisions and running the same scenario against each: a kill dealt by a bomb blast or a black-heart burst now resolves in the step the damage lands, where it used to resolve one step later. That damage was written to the legacy list alone and reached the actors through an `hpById` re-sync that ran AFTER the cleanup fold, so the corpse took one more AI turn and its drop, kill credit and room clear landed late. It is the same defect class as section 14.21, it shifts the `DropRng` draw order for such kills, and it is now declared in AC-008 and guarded by a bomb-kill test -- no test covered a bomb kill at all before this cycle. The canonical determinism encoding also changes, which AC-008 declares as expected."]
