    rationale: "purchaseM5ShopSlot grants no item, so the two deleted shop assertions have nothing true to assert against. Granting it needs stat modifiers on Entities.ItemDefinition, which the item pedestal and the boss reward need too; inventing that mapping inside a refactor whose acceptance is that a player sees no change would be the wrong place for the decision."
    owner: "EHotwagner/rogue3 - src/Rogue3/Model.fs purchaseM5ShopSlot and src/Rogue3/Entities.fs ItemDefinition, tracked as EHotwagner/rogue3#47"
    scope: "Pre-existing and player-facing: InteractM5Shop has always been the only wired shop message. This item removed the unreachable reducer that concealed it, not the capability."
    laterLifecycleVisibility: "Pinned by a characterization assertion in M3CombatHealthCurrencyTests and M10AcceptanceDeterminismTests scenario 11 that goes red the day EHotwagner/rogue3#47 is fixed."
    notes: ["PD-017. Both critics independently found that two deleted shop assertions could not be restated: `purchaseM5ShopSlot` debits, empties the offer and bumps `RunStats.ItemsFound` without touching `PlayerItems` or calling `recomputePlayerStats`. Probed at the candidate, buying `cracked-lens` for 7 coins with 10 in hand gives `coins=3 items=[] damage=3.500000 itemsFound=1`. After this removal `PlayerItems` has no production writer and `recomputePlayerStats` has no production caller. The gap is PRE-EXISTING and player-facing -- `InteractM5Shop` has always been the only wired shop message -- and what concealed it was the unreachable pre-M5 reducer that did grant the item. Closing it needs stat modifiers on `Entities.ItemDefinition`, which the item pedestal and boss reward need too, so it is filed at root cause as EHotwagner/rogue3#47, recorded as DEF-003 and SB-014, and pinned by a characterization assertion in both shop tests that goes red the day it is fixed. This is the one place CA-009's rewrite-never-delete rule was not met, and it is recorded as an admission rather than absorbed."]
