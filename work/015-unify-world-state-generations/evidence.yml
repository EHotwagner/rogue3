    notes: ["FR-006/AC-006. One shop. The affordability and rejection properties previously asserted against `purchaseShopSlot` are asserted against `purchaseM5ShopSlot` in M3 and dispatched through `InteractM5Shop` in M10 scenario 11; because `Entities.purchase` consumes a slot by setting `Offer = Empty` rather than removing it, those assertions read the offer and `RunStats.ItemsFound` instead of a list length. TWO assertions could NOT be restated and were lost: the granted `PlayerItems` contents and the recomputed `PlayerStats.Damage`. The surviving reducer grants no item -- it debits, empties the offer and bumps a counter -- so there is nothing true to assert. That is a pre-existing, player-facing gap the removed dead reducer concealed (it did grant the item, and had zero production dispatch sites), it is the one place CA-009's rewrite-never-delete rule was not met, and it is recorded as DEF-003, filed at root cause as EHotwagner/rogue3#47, and pinned by a characterization assertion in both tests so it goes red the day it is fixed. Two independent critics found this; the first draft of this entry claimed no shop coverage was deleted."]
