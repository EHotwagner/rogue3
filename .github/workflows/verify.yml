name: verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-tests:
    name: Release tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Restore
        run: >-
          dotnet restore Rogue3.slnx
          -p:_FSharpCoreLibraryPacksFolder=${{ github.workspace }}/.nuget/disabled-fsharp-library-packs
      - name: Test Release candidate
        run: dotnet test tests/Rogue3.Tests/Rogue3.Tests.fsproj -c Release --no-restore
