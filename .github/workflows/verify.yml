name: verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-tests:
    name: Release tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      # The feedback-report validator decides whether a merged cycle report is
      # still evidence. It carries a deliberate one-path exemption (rogue3#40):
      # the audit-binding excuse ledger, whose digest has no fixed point. This
      # selftest proves the exemption is still exactly that one path and that an
      # ordinary stale digest is still an error, so the exemption cannot quietly
      # widen into "the validator checks nothing".
      #
      # Deliberately NOT in audit-bindings.yml, even though that is where its
      # sibling `check-audit-bindings.py --selftest` runs: that workflow file is
      # itself cited by feedback/audits/2026-08-02-Rogue3-7.audit.json and -9,
      # so editing it makes both of those accepted reports fail validate -- the
      # exact breakage this item exists to remove.
      - name: Self-test the feedback-report validator
        run: dotnet fsi .agents/skills/fs-gg-feedback-report/scripts/feedback-tool.fsx -- selftest
      # rogue3#52: until now nothing in CI executed `build.fsx` in ANY target, so
      # every check the documented merge gate owns was enforced only by a human
      # remembering to run it locally. `GovernanceTests.fs` reads build.fsx as
      # TEXT and asserts required/forbidden substrings, so a *textual* regression
      # is caught by `dotnet test` -- but nothing executed its logic, and a check
      # that quietly stops checking passed green. (`grep -rn` over tests/ finds no
      # reference to SelfTest, TemplateDrift or GeneratedGuidanceCheck at all.)
      #
      # Measured at 09895b9, not argued: making `templateDriftViolations` return
      # [] unconditionally leaves `dotnet test -c Release` completely green
      # (Failed: 0, Passed: 235) while `./fake.sh -t SelfTest` exits 1 with
      # "SelfTest: 77 case(s), 15 failure(s)". This step is what kills that mutant.
      # (That case count is anchored at 09895b9 and is deliberately not updated;
      # the same tree is 111 cases today. Re-measured at 48b3a6a for rogue3#57:
      # the same mutant gives 111 case(s), 42 failure(s), still exit 1.)
      #
      # SelfTest plants a violation for each check and requires it to be reported,
      # and additionally asserts TemplateDrift and GeneratedGuidanceCheck are clean
      # on the checked-out tree. Those repo-clean assertions call the check
      # FUNCTIONS directly rather than the targets, which is what makes them
      # strictly stronger than a `-t TemplateDrift` step: with the target dispatch
      # neutered to `writeLog target` AND a genuinely drifted kit file present,
      # `./fake.sh -t TemplateDrift` exits 0 while `-t SelfTest` exits 1 (measured).
      # So the target invocations are deliberately NOT added here; they would be
      # weaker duplicates, not extra coverage.
      #
      # It is hermetic: fixtures go
      # to the system temp dir, build.fsx carries no `#r` (BCL only), and the
      # engine assembly is `lazy` and only forced by EvidenceGraph/EvidenceAudit,
      # so SelfTest needs neither `dotnet restore` nor an engine feed. Hence it
      # runs BEFORE Restore, where it fails fastest. That still holds after
      # rogue3#57, whose self-probe re-runs THIS script as a child and so inherits
      # the same BCL-only hermeticity -- but two facts about the step changed and
      # are worth stating rather than leaving a reader to discover:
      #   * It now SPAWNS A PROCESS, and its runtime roughly doubled -- measured
      #     1.8s before, 3.5s after, of which ~1.8s is the child.
      #   * Its writes are readiness/logs/{SelfTest,TemplateDrift,
      #     GeneratedGuidanceCheck}.txt plus readiness/logs/selftest-result.json,
      #     and one temp probe JSON under the system temp dir that it deletes.
      #     .gitignore's `readiness/*/*` already excludes all four.
      #
      # THREE gates this repository mandates are DELIBERATELY still not wired
      # here. This job does NOT enforce every mandated gate and does not claim to;
      # the list below is meant to be exhaustive, so that anything missing from it
      # is a bug in this comment:
      #   * The full `Verify` target (TemplateDrift + GeneratedGuidanceCheck, then
      #     the EvidenceGraph -> EvidenceAudit merge-gate audit, plus ADR-0056's
      #     fail-closed lifecycle guard). THE OLD REASON HERE IS GONE: it said
      #     Verify rewrites TRACKED readiness artifacts so a dirty-tree job would
      #     fail for reasons unrelated to the PR, and rogue3#56 removed those
      #     artifacts from the index -- a full Verify now exits 0 leaving
      #     `git status --porcelain` empty, measured twice consecutively on that
      #     item's candidate. The remaining reason is narrower and is the SECOND
      #     bullet below: Verify runs the measured performance gate, whose pass
      #     depends on runner contention rather than on the PR. A dirty-tree job
      #     over Verify would therefore be gating merges on latency again. The
      #     part of Verify that rogue3#56 DID make enforceable -- that the derived
      #     roll-ups stay out of the index -- is wired as its own step below, and
      #     it needs no build.
      #     Wiring the rest is tracked by rogue3#52.
      #   * The fail-closed normal-play PERFORMANCE gate (`PerformanceIntent` +
      #     `PerformanceEvidence`, which `Test` and `Verify` both run and which raw
      #     `dotnet test` does not). Both exit 0 on this tree, so this is not a red
      #     gate -- it is a NON-REPRODUCIBLE one. Its artifacts are measured
      #     latencies: two consecutive `-t PerformanceEvidence` runs on an idle
      #     host produced different p50/p95/p99 values and a different
      #     artifactDigest in readiness/performance-evidence.json, and neither
      #     matched the committed bytes. On a shared runner that is worse, so
      #     requiring it would gate merges on runner contention. rogue3#56 removed
      #     the CHURN half of this (the artifacts are no longer tracked, so the run
      #     leaves no diff); the non-reproducibility that makes the gate unsuitable
      #     for CI is unchanged, because it was never about tracking.
      #   * The feedback-report validator CORPUS -- `validate` over every
      #     feedback/*.md against its audit. Measured at bfd1288 over all 23
      #     pairs: 3 pass, 20 fail. Audits legitimately cite files that later
      #     change and `validate` has no excuse ledger (rogue3#49), so requiring
      #     it as-is would red every open PR. The validator's own `selftest`
      #     directly above is a different check and IS required.
      #
      # Scope limits worth naming, so a green result is not over-read. These
      # figures were RE-DERIVED at 48b3a6a for rogue3#57; the older ones here were
      # measured before rogue3#46 rewrote this area and had gone stale:
      #   * TemplateDrift covers 190 of 190 kit files (rogue3#46 closed the 64/190
      #     gap via scripts/kit-pins.json), so a green SelfTest now does mean every
      #     kit file the gate knows about matched its pin. It does NOT mean the
      #     inventory is complete -- rogue3#62 records that a symlinked kit root
      #     still reports 190 when only 95 distinct files exist.
      #   * Mutation results, stated over a FIXED mutant set so the two sides are
      #     comparable. On the SAME 24 mutants, 17 survived SelfTest before
      #     rogue3#57 and 2 survive after. (Not the "7 of 23" in rogue3#57's body:
      #     that sweep predates rogue3#46 and was re-derived here at 48b3a6a.)
      #     Both remaining survivors of that set are measured NON-defeats -- they
      #     make the printed ok/FAIL labels lie without changing the verdict, and
      #     their drift-carrying counterparts are killed.
      #   * A further 28 mutants were written against the new design, 20 of them by
      #     two independent reviewing critics; 52 rows in all, 5 survivors. Exactly
      #     ONE is a single-edit GATE DEFEAT, and it is the residual named in
      #     build.fsx's own help banner: an edit that exempts any root it recognises
      #     AS this repository by a MARKER FILE it contains, rather than by the
      #     current directory. SelfTest cannot certify it is still bound to the real
      #     tree. Running both checks from a different working directory closes
      #     every cwd-keyed form -- plain, path-normalising, and one keyed on "the
      #     root is not under the temp dir", which is the property every fixture
      #     relies on and so reads as an optimisation rather than a backdoor -- but
      #     it does NOT close the class.
      #     Of the other four survivors: two are the transcript-only non-defeats
      #     above, one disables ONE of the probe's two channels and is killed
      #     independently by the other, and one is a deliberate TWO-edit
      #     combination. A reviewer also demonstrated that replacing the whole
      #     ~50-line verdict block in one contiguous edit defeats the gate; that is
      #     not a single-LINE edit and a reviewer would see it, but it is real and
      #     is recorded here rather than left out because it is inconvenient.
      #   * main is not branch-protected, so no check here is a REQUIRED status
      #     check -- these gates block by turning a job red, not by blocking merge.
      #
      # Why this guard reads a FILE and not the log (rogue3#57):
      # Every guard this step has carried was defeated by forging the transcript.
      # Grepping for "FAIL" was fail-OPEN to renaming one printf label. Its
      # replacement, ok-count == case-count, was fail-open to a single contiguous
      # edit replacing `expect`'s failure branch with `printfn "  ok   %s"`, which
      # produced 111 ok lines, 111 cases, and exit 0 with a vacuous check present
      # (found by rogue3#46's reviewer; measured again at 48b3a6a). There is no
      # third arrangement of stdout-scraping that survives, because stdout is the
      # thing being forged.
      #
      # So SelfTest now emits readiness/logs/selftest-result.json, derived from the
      # same recorded case list its verdict is computed from, and it self-probes by
      # re-running itself in a CHILD process with one deliberately-failing case
      # injected -- requiring the child to exit non-zero AND to record exactly one
      # more case and one more failure than the parent. This step asserts the
      # structured result, so a forged transcript is simply not read.
      # rogue3#56. The three roll-ups below are run outputs, and `.gitignore` plus
      # scripts/check-audit-bindings.py both say so -- the checker stops checking the
      # merged-audit digests pinned over them on the strength of that declaration.
      # Neither file can notice the one change that would falsify it: a `.gitignore`
      # rule has no effect on a path already in the index, so `git add -f` puts the
      # bytes back under version control, restores the committable-diff-every-run
      # defect, and leaves the checker still refusing to check them. Only the index
      # answers that, and only CI has both the index and no reason to lie about it.
      # It runs before the build because it needs nothing built.
      #
      # What it enforces, stated exactly, because the obvious summary is too generous:
      # NOT rogue3#56's acceptance ("a full Verify leaves git status --porcelain
      # empty"). It enforces a PROXY of it -- that these three named paths stay out of
      # the index and stay ignored. If build.fsx later starts writing a fourth tracked
      # artifact, the acceptance is violated and this step stays green, because nothing
      # in CI runs Verify and inspects the tree (deliberately -- see the performance
      # bullet in the comment above). What this step does buy is that the three paths
      # the exemption in scripts/check-audit-bindings.py stops checking cannot quietly
      # become tracked again, which is the failure that would turn the exemption from a
      # correct statement into a hole.
      - name: Derived roll-ups stay out of the index
        run: |
          set -euo pipefail
          fail=0
          for p in readiness/evidence-graph.md \
                   readiness/performance-evidence.json \
                   readiness/m7-ui-performance.json; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              echo "::error file=$p::$p is TRACKED. rogue3#56 removed it from the index because it is a build-target output no checkout can reproduce, and scripts/check-audit-bindings.py exempts the merged-audit digests pinned over it on that basis. Run: git rm --cached $p"
              fail=1
            fi
            # --no-index: git check-ignore consults the index by default and reports a
            # TRACKED path as not-ignored whatever .gitignore says, so without this the
            # tracked case above would also fire this branch and tell the reader to
            # restore a rule that was never removed.
            if ! git check-ignore --no-index -q "$p"; then
              echo "::error file=.gitignore::$p is no longer ignored by .gitignore. Restore the rule, or remove the path from DERIVED_ROLLUP_RELPATHS in scripts/check-audit-bindings.py so its audit bindings are checked again."
              fail=1
            fi
          done
          # The list above is duplicated from .gitignore and from the checker on
          # purpose -- three independent statements that must agree. Prove the pair
          # this job can see really do agree, so a path silently dropped from the
          # checker's constant cannot leave this step passing over a shorter list.
          # PYTHONDONTWRITEBYTECODE: importing the checker as a module would
          # otherwise leave scripts/__pycache__/ behind, which is neither tracked nor
          # ignored -- a step that proves the tree is clean must not dirty it.
          declared="$(PYTHONDONTWRITEBYTECODE=1 python3 -c 'import importlib.util; s=importlib.util.spec_from_file_location("c", "scripts/check-audit-bindings.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print("\n".join(sorted(m.DERIVED_ROLLUP_RELPATHS)))')"
          expected="$(printf '%s\n' readiness/evidence-graph.md readiness/m7-ui-performance.json readiness/performance-evidence.json)"
          if [ "$declared" != "$expected" ]; then
            echo "::error file=scripts/check-audit-bindings.py::DERIVED_ROLLUP_RELPATHS and this job's list disagree."
            diff <(echo "$expected") <(echo "$declared") || true
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            echo "All three derived roll-ups are untracked, ignored, and agree with DERIVED_ROLLUP_RELPATHS."
          fi
          exit "$fail"

      - name: Self-test the build.fsx merge gate
        run: |
          set -euo pipefail
          result=readiness/logs/selftest-result.json
          # Remove any pre-existing artifact FIRST, so this step can never read a
          # stale result as if this run had produced it. It is gitignored, so a
          # fresh checkout has none -- but a local run of this step would.
          rm -f "$result"
          # The `tee` the previous guard used is simply not needed now that no file
          # is parsed out of the log -- the output still reaches the step log
          # either way. (It was never an exit-code hazard: `set -o pipefail` on the
          # line above already returns the rightmost non-zero status.)
          ./fake.sh -t SelfTest
          if [ ! -f "$result" ]; then
            echo "::error::SelfTest wrote no structured result at $result -- it did not run to completion (rogue3#57)."
            exit 1
          fi
          cat "$result"
          field() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$result" "$1"; }
          verdict="$(field verdict)"
          probed="$(field probed)"
          cases="$(field cases)"
          failures="$(field failures)"
          # `verdict` covers the WHOLE target, including the repository-clean raises
          # that the case tally never sees; `probed` proves the run actually checked
          # its own failure path rather than merely reporting a zero.
          if [ "$verdict" != "pass" ]; then
            echo "::error::SelfTest recorded verdict=$verdict."
            exit 1
          fi
          if [ "$probed" != "True" ]; then
            echo "::error::SelfTest did not probe its own failure path (probed=$probed) -- its verdict is not evidence."
            exit 1
          fi
          if [ "$cases" -lt 1 ]; then
            echo "::error::SelfTest recorded $cases cases -- a gate that asserts nothing is not a pass."
            exit 1
          fi
          if [ "$failures" != "0" ]; then
            echo "::error::SelfTest recorded $failures failing case(s) of $cases."
            exit 1
          fi
          # rogue3#62. A case whose PRECONDITION cannot be established on this host
          # records nothing at all, so a runner that refuses symbolic links or runs
          # as root reports a smaller, entirely healthy-looking total and exits 0 --
          # measured at 164 -> 156 (8 cases in 4 groups) and 164 -> 153 (11 cases
          # in 8 groups) for those two hosts, both still "0 failure(s)"; a real root
          # run also loses the two unlistable-directory cases, which carry their own
          # probe. `cases -lt 1` cannot see any of that, and the only other signal
          # was a note in the transcript, which is the one channel #57 established
          # must not be trusted. THIS runner (ubuntu-latest, non-root, symlinks
          # permitted) skips nothing, so requiring zero is a statement about the
          # runner and not about the suite: if it ever starts skipping, the reason is
          # named here rather than absorbed into a smaller number nobody compares.
          skipped="$(field skipped)"
          if [ "$skipped" != "0" ]; then
            echo "::error::SelfTest skipped $skipped case group(s) on this runner, so it did not prove what its case count implies. See skippedCases in $result."
            exit 1
          fi
          echo "SelfTest: verdict=$verdict probed=$probed, $cases case(s), $failures failure(s), $skipped skipped."
      # Every cycle's checkpoint JSONL must still parse and satisfy the schema the
      # fs-gg-feedback-report skill mandates. Unlike the report/audit CORPUS below,
      # this one is SAFE to require and is wired: checkpoints pin no digests over
      # other files, so they cannot rot when an unrelated file changes -- which is
      # exactly why the corpus is red (rogue3#49) and this is green. Measured over
      # every checkpoint file at 09895b9: 25 pass, 0 fail.
      - name: Validate every cycle's checkpoint state
        run: |
          set -euo pipefail
          fail=0
          for f in feedback/checkpoints/*.jsonl; do
            if ! dotnet fsi .agents/skills/fs-gg-feedback-report/scripts/feedback-tool.fsx -- validate-checkpoints "$f"; then
              echo "::error file=$f::checkpoint file failed validation"
              fail=1
            fi
          done
          exit "$fail"
      - name: Restore
        run: >-
          dotnet restore Rogue3.slnx
          -p:_FSharpCoreLibraryPacksFolder=${{ github.workspace }}/.nuget/disabled-fsharp-library-packs
      - name: Test Release candidate
        run: dotnet test tests/Rogue3.Tests/Rogue3.Tests.fsproj -c Release --no-restore
