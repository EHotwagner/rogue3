name: verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-tests:
    name: Release tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      # The feedback-report validator decides whether a merged cycle report is
      # still evidence. It carries a deliberate one-path exemption (rogue3#40):
      # the audit-binding excuse ledger, whose digest has no fixed point. This
      # selftest proves the exemption is still exactly that one path and that an
      # ordinary stale digest is still an error, so the exemption cannot quietly
      # widen into "the validator checks nothing".
      #
      # Deliberately NOT in audit-bindings.yml, even though that is where its
      # sibling `check-audit-bindings.py --selftest` runs: that workflow file is
      # itself cited by feedback/audits/2026-08-02-Rogue3-7.audit.json and -9,
      # so editing it makes both of those accepted reports fail validate -- the
      # exact breakage this item exists to remove.
      - name: Self-test the feedback-report validator
        run: dotnet fsi .agents/skills/fs-gg-feedback-report/scripts/feedback-tool.fsx -- selftest
      # rogue3#52: until now nothing in CI executed `build.fsx` in ANY target, so
      # every check the documented merge gate owns was enforced only by a human
      # remembering to run it locally. `GovernanceTests.fs` reads build.fsx as
      # TEXT and asserts required/forbidden substrings, so a *textual* regression
      # is caught by `dotnet test` -- but nothing executed its logic, and a check
      # that quietly stops checking passed green. (`grep -rn` over tests/ finds no
      # reference to SelfTest, TemplateDrift or GeneratedGuidanceCheck at all.)
      #
      # Measured at 09895b9, not argued: making `templateDriftViolations` return
      # [] unconditionally leaves `dotnet test -c Release` completely green
      # (Failed: 0, Passed: 235) while `./fake.sh -t SelfTest` exits 1 with
      # "SelfTest: 77 case(s), 15 failure(s)". This step is what kills that mutant.
      #
      # SelfTest plants a violation for each check and requires it to be reported,
      # and additionally asserts TemplateDrift and GeneratedGuidanceCheck are clean
      # on the checked-out tree. Those repo-clean assertions call the check
      # FUNCTIONS directly rather than the targets, which is what makes them
      # strictly stronger than a `-t TemplateDrift` step: with the target dispatch
      # neutered to `writeLog target` AND a genuinely drifted kit file present,
      # `./fake.sh -t TemplateDrift` exits 0 while `-t SelfTest` exits 1 (measured).
      # So the target invocations are deliberately NOT added here; they would be
      # weaker duplicates, not extra coverage.
      #
      # It is hermetic: fixtures go
      # to the system temp dir, build.fsx carries no `#r` (BCL only), and the
      # engine assembly is `lazy` and only forced by EvidenceGraph/EvidenceAudit,
      # so SelfTest needs neither `dotnet restore` nor an engine feed. Hence it
      # runs BEFORE Restore, where it fails fastest. Its only write is
      # readiness/logs/SelfTest.txt, which .gitignore already excludes.
      #
      # THREE gates this repository mandates are DELIBERATELY still not wired
      # here. This job does NOT enforce every mandated gate and does not claim to;
      # the list below is meant to be exhaustive, so that anything missing from it
      # is a bug in this comment:
      #   * The full `Verify` target (TemplateDrift + GeneratedGuidanceCheck, then
      #     the EvidenceGraph -> EvidenceAudit merge-gate audit, plus ADR-0056's
      #     fail-closed lifecycle guard). Verify rewrites TRACKED readiness
      #     artifacts; rogue3#26 (the exit-0-on-a-falsified-graph half) landed in
      #     #54, but rogue3#56 is OPEN -- those roll-ups are still derived from a
      #     partly-untracked tree. A job that ran Verify and then checked for a
      #     dirty tree would fail for reasons unrelated to the PR under test.
      #   * The fail-closed normal-play PERFORMANCE gate (`PerformanceIntent` +
      #     `PerformanceEvidence`, which `Test` and `Verify` both run and which raw
      #     `dotnet test` does not). Both exit 0 on this tree, so this is not a red
      #     gate -- it is a NON-REPRODUCIBLE one. Its artifacts are measured
      #     latencies: two consecutive `-t PerformanceEvidence` runs on an idle
      #     host produced different p50/p95/p99 values and a different
      #     artifactDigest in readiness/performance-evidence.json, and neither
      #     matched the committed bytes. On a shared runner that is worse, so
      #     requiring it would gate merges on runner contention. Tracked by
      #     rogue3#56 for the tracked-artifact churn.
      #   * The feedback-report validator CORPUS -- `validate` over every
      #     feedback/*.md against its audit. Measured at bfd1288 over all 23
      #     pairs: 3 pass, 20 fail. Audits legitimately cite files that later
      #     change and `validate` has no excuse ledger (rogue3#49), so requiring
      #     it as-is would red every open PR. The validator's own `selftest`
      #     directly above is a different check and IS required.
      #
      # Scope limits worth naming, so a green result is not over-read. These
      # figures were RE-DERIVED at 48b3a6a for rogue3#57; the older ones here were
      # measured before rogue3#46 rewrote this area and had gone stale:
      #   * TemplateDrift covers 190 of 190 kit files (rogue3#46 closed the 64/190
      #     gap via scripts/kit-pins.json), so a green SelfTest now does mean every
      #     kit file the gate knows about matched its pin. It does NOT mean the
      #     inventory is complete -- rogue3#62 records that a symlinked kit root
      #     still reports 190 when only 95 distinct files exist.
      #   * Before rogue3#57, 17 of 24 mutants survived SelfTest (not the 7 of 23
      #     in that issue's body, which predates rogue3#46). After it, 4 of 39
      #     survive and only ONE is a gate defeat: an edit that exempts any root it
      #     recognises AS this repository by a MARKER FILE rather than by the
      #     current directory. SelfTest cannot certify it is still bound to the real
      #     tree; that residual is named in build.fsx's own help banner. The other
      #     three survivors are measured non-defeats -- two make the printed labels
      #     lie without changing the verdict, and one disables a single probe
      #     channel that the other channel independently kills.
      #   * main is not branch-protected, so no check here is a REQUIRED status
      #     check -- these gates block by turning a job red, not by blocking merge.
      #
      # Why this guard reads a FILE and not the log (rogue3#57):
      # Every guard this step has carried was defeated by forging the transcript.
      # Grepping for "FAIL" was fail-OPEN to renaming one printf label. Its
      # replacement, ok-count == case-count, was fail-open to a single contiguous
      # edit replacing `expect`'s failure branch with `printfn "  ok   %s"`, which
      # produced 111 ok lines, 111 cases, and exit 0 with a vacuous check present
      # (found by rogue3#46's reviewer; measured again at 48b3a6a). There is no
      # third arrangement of stdout-scraping that survives, because stdout is the
      # thing being forged.
      #
      # So SelfTest now emits readiness/logs/selftest-result.json, derived from the
      # same recorded case list its verdict is computed from, and it self-probes by
      # re-running itself in a CHILD process with one deliberately-failing case
      # injected -- requiring the child to exit non-zero AND to record exactly one
      # more case and one more failure than the parent. This step asserts the
      # structured result, so a forged transcript is simply not read.
      - name: Self-test the build.fsx merge gate
        run: |
          set -euo pipefail
          # NOTE the absence of a pipe: `./fake.sh | tee` would hand the step
          # `tee`'s exit status. The true exit code of SelfTest is load-bearing
          # here, so it is taken directly.
          ./fake.sh -t SelfTest
          result=readiness/logs/selftest-result.json
          if [ ! -f "$result" ]; then
            echo "::error::SelfTest wrote no structured result at $result -- it did not run to completion (rogue3#57)."
            exit 1
          fi
          cat "$result"
          cases="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["cases"])' "$result")"
          failures="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["failures"])' "$result")"
          if [ "$cases" -lt 1 ]; then
            echo "::error::SelfTest recorded $cases cases -- a gate that asserts nothing is not a pass."
            exit 1
          fi
          if [ "$failures" != "0" ]; then
            echo "::error::SelfTest recorded $failures failing case(s) of $cases."
            exit 1
          fi
          echo "SelfTest: $cases case(s) recorded, $failures failure(s)."
      # Every cycle's checkpoint JSONL must still parse and satisfy the schema the
      # fs-gg-feedback-report skill mandates. Unlike the report/audit CORPUS below,
      # this one is SAFE to require and is wired: checkpoints pin no digests over
      # other files, so they cannot rot when an unrelated file changes -- which is
      # exactly why the corpus is red (rogue3#49) and this is green. Measured over
      # every checkpoint file at 09895b9: 25 pass, 0 fail.
      - name: Validate every cycle's checkpoint state
        run: |
          set -euo pipefail
          fail=0
          for f in feedback/checkpoints/*.jsonl; do
            if ! dotnet fsi .agents/skills/fs-gg-feedback-report/scripts/feedback-tool.fsx -- validate-checkpoints "$f"; then
              echo "::error file=$f::checkpoint file failed validation"
              fail=1
            fi
          done
          exit "$fail"
      - name: Restore
        run: >-
          dotnet restore Rogue3.slnx
          -p:_FSharpCoreLibraryPacksFolder=${{ github.workspace }}/.nuget/disabled-fsharp-library-packs
      - name: Test Release candidate
        run: dotnet test tests/Rogue3.Tests/Rogue3.Tests.fsproj -c Release --no-restore
